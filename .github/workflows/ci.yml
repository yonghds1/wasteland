name: CI

on:
  push:
  pull_request:

# 同一分支连续 push 时取消旧的排队运行，避免陈旧运行占用免费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typecheck → lint → validate:i18n → check:locale-parity → check:contrast → vitest
      - name: Run gates
        run: npm run check
